

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% load static %}
    <link rel="stylesheet" href="	https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"> 
   <link rel="stylesheet" type="text/css" href="{% static 'nav.css' %}">
    <title>Document</title>
</head>
<body>
 <div></div>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
      
        <div class="container-fluid">
          <a class="navbar-brand" href="{% url 'home' %}"><img style="height: 50px; width:50px; background-color:aliceblue;border-radius:50%;" src="{% static 'images/logo.png' %}"  alt="logo"></a>
          <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
              <li class="nav-item">
                <a class="nav-link active"  href="{% url 'home' %}">Home</a>
              </li>
              {% if request.user.is_authenticated %}
              <li class="nav-item">
                <a class="nav-link"  href="/logout">logout</a>
              </li>
              {% else %}
              <li class="nav-item">
                <a class="nav-link" href="{% url 'login' %}">Login</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="{% url 'register' %}">Sign Up</a>
              </li>
              {% endif %}
            </ul>

            {% if request.user.is_authenticated %}
            <small class="navbar-brand mx-auto d-block">hi {{user.username}}</small>
            {% endif %}

            <form class="d-flex" role="search">
              <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search">
              <button class="btn btn-outline-success" type="submit">Search</button>
            </form>
          </div>
        </div>
      
        
      </nav>
</body>
</html>
