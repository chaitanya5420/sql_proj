
{% include 'nav.html' %}
<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <title>Document</title>
    <link rel="stylesheet"  href="{% static 'gallary.css' %}">

<style>
.image-thumbnail{
    height:200px;
    object-fit: cover;
}
</style>

</head>
<body>
<div class="m-5">
    <div class="container">
        <div class="row">
            <div class="col-md-3">
                <div class="card" style="width: 18rem;">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        CATEGORIES

                        <a style="border-radius:50%" class="btn btn-secondary" href="{% url 'home' %}">HOME</a>

                    </div>
                        <ul class="list-group list-group-flush">
                            <li class="list-group-item"><a href="{% url 'gallary' %}">all</a></li>
                            {% for category in categories %}
                            <li class="list-group-item"><a href="{% url 'gallary' %}?category={{category.name}}">{{category.name}}</a></li>
                            {% endfor %}
                        </ul>
                            <a class="btn btn-dark btn-block btn-sm m-1" href="{% url 'add' %}">add</a>
                        
                </div>
            </div>

            
            <div class="col-md-9">
                <div class="row">
                    {% for photo in photos %}
                  <div class="col-md-4">
                        <div class="card m-2"  >

                             <img class="image-thumbnail"  src='{{photo.image.url}}'  alt="error">

                            <div class="card-body">
                                 <h3>category:{{photo.category.name}}</h3>
                                 <h6>description:{{photo.description}}</h6>             
                            </div>
                           <a href="{% url 'photo' photo.id %}" class="btn btn-outline-dark btn-sm m-1">view</a>
                        </div>
                    </div>
                    {% empty %}
                    <h1>no photo</h1>
                    {% endfor %} 
                   
                </div>
            </div>
        </div>
    </div>
</div>
   
    
</body>
</html>
