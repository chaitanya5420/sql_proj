{% include 'nav.html' %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Uploaded Files</title>
<style>
    .custom-link {
        display: block;
        position: relative;
        background-color: #000000; /* Background color of the card */
        padding: 10px; /* Adjust as needed */
        text-align: center;
        text-decoration: none;
        color: #ffffff;
        border-radius: 5px; /* Adjust as needed */
    }
    
    .custom-link:hover {
        background-color: #e9ecef; /* Hover background color of the card */
    }
    
    .custom-link span {
        position: relative;
        z-index: 1;
    }
   
    .start{
        color: #22223B;
    }
    
</style>

</head>
<body>
    <div class="upper-row">
        <div class="col d-flex justify-content-center">
            <a style="width:7%" class="btn btn-dark btn-block btn-sm m-1" href="{% url 'file_upload' %}">ADD</a>
            <a style="width:7%" class="btn btn-dark btn-block btn-sm m-1" href="{% url 'home' %}">HOME</a>

        </div>
        
    </div>
    
    
    <ul class="container m-3">
        <div class="row row-cols-1 row-cols-md-2 row-cols-lg-4 g-4">
            {% for file in files %}
            <div class="col">
                <div class="card">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center">
            
                        </div>
                        <h5 class="card-title">
                            <a class="custom-link" href="{% url 'show_tables' file_id=file.id %}">
                                <span class="text-center">{{ file.name }}</span>
                            </a>
                        </h5>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </ul>
    
    
</body>
</html>
