{% include 'nav.html' %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Uploaded Files</title>
</head>
<body>
    

    <a href="{% url 'file_upload' %}">add</a>
    <h2>Files</h2>
    <ul>
        <div class="container">
            <h2>Uploaded Files</h2>
            <div class="row row-cols-1 row-cols-md-2 row-cols-lg-4 g-4">
                {% for file in files %}
                <div class="col">
                    <div class="card">
                        <div class="card-body">
                            <h5 class="card-title"><a href="{% url 'show_tables' file_id=file.id %}">{{ file.name }}</a></h5>
                        </div>
                    </div>
                </div>
                {% endfor %}
            </div>
        </div>
</body>
</html>
