<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
<style>
  .container{
    margin-top: 2%;
  }
  h2{
    border-bottom: 1px solid  rgba(243, 13, 13, 0.897);
    color:rgba(255, 255, 255, 0.904) ;
    text-align: center;
}
.card{
    background-color: #121118e4;
    box-shadow: 0px 3px 30px;
    margin-top: 20%;

}
input{
    position: relative;
    border-radius: 10px ;
    border: 1px solid  rgba(63, 63, 63, 0.897);
    background-color: white !important;
    margin-top: 3%;
    width: 100%;
    padding-bottom: 9px ;
    display:block;
    padding:3% ;
    background-color: #121118e4;

}
.btn{
  
    background-color: rgba(243, 13, 13, 0.897);
    color: white;
}
label{
    color:white;
}      
.link-style{
    color:red;
}
.btn.btn-dark{
    background-color: #000000;
}

</style>
</head>
<body>
<div class=""></div>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-4">
                    <div class="card">
                      <h2 class="card-title-light text-center m-3 ">Upload</h2>

                        <form method="POST" action="" enctype="multipart/form-data">
                            {% csrf_token %}
                            <div class="form-group mt-2 m-4">
                                <label for="id_name">Name</label>
                                <input required name="name" type="text" placeholder="Enter name" class="form-control">
  
                              </div>
                              <div class="form-group m-4">
                                <label for="id_file">Choose File</label>
                                <input required name="file" type="file" class="form-control">
  
                              </div>
                            

                            <div class="card-body text-center mb-3">
                              <div class="row">
                                  <div class="col-sm-6">
                                      <button class="btn btn-block w-100" type="submit">Submit</button>
                                  </div>
                                  <div class="col-sm-6">
                                      <a class="btn btn-block w-100" href="{% url 'base' %}">Return</a>
                                  </div>
                              </div>
                          </div>
                          
                            

                          </form>

                        
                    </div>
                    
            </div>

        </div>
    </div>
</body>
</html>
