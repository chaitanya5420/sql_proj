{% load static %}
{% include 'nav.html' %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet"  href="{% static 'gallary.css' %}">

    <title>Document</title>
</head>
<body>
    <div class="m-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col">                    
                    <div class="card" style="border:10px solid black; border-radius:2%;">
                        <img class="card-img-top" src="{{ photos.image.url }}" alt="error">
                        <div class="card-body" stayle="padding:3%;">
                            <h5 class="card-title">
                                <span class="border-bottom border-dark pb-1">Category:</span> {{ photos.category.name }}
                            </h5>
                            <p class="card-text border border-dark p-2">Description: {{ photos.description }}</p>
                            <div class="d-flex justify-content-between align-items-center">
                                <a class="btn btn-dark" href="{% url 'gallary' %}">Return</a>
                                <form action="{% url 'delete_photo' pk=photos.id %}" method="post">
                                    {% csrf_token %}
                                    <button class="btn btn-danger" type="submit">Delete Photo</button>
                                </form>
                                
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
</body>
</html>
