<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

</head>
<body>
<div class="m-5"></div>
    <div class="container ">
        <div class="row justify-content-center">
            <div class="col-md-4">

                    <div class="card">
                        <form method="POST" action="" enctype="multipart/form-data">
                            {% csrf_token %}
                            <div class="form-group m-3">
                                <label >description</label>
                                <input required name="description" type="text" placeholder="enter description" class="form-control">
  
                              </div>
                              <div class="form-group m-3">
                                <label >category</label>
                                <select name="category"  class="form-control">
                                    <option value="none">select a category</option>
                                    {% for category in categories %}
                                    <option value="{{category.id}}">{{category.name}}</option>
                                    {% endfor %}
                                </select>
  
                              </div>

                              <div class="form-group m-3">
                                <label >create a new category</label>
                               <input name="new_category" type="text" placeholder="create a new category" class="form-control">
                              </div>


                            <div class="form-group m-3">
                              <label >upload image</label>
                              <input required  name="image" type="file" class="form-control-file">
                            </div>
                            <button type="submit" class="btn btn-dark m-3 ">submit</button>
                            <a class="btn btn-dark my-1" href="{% url 'gallary' %}">return</a>

                          </form>

                        
                    </div>
                    
            </div>

        </div>
    </div>
</body>
</html>
