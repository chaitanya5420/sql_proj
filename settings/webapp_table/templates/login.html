<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        .link-style {
            color: #007bff; /* Change color as needed */
            text-decoration: none;
        }
        
        .link-style:hover {
            text-decoration: underline;
        }
        h2{
            border-bottom: 1px solid  rgba(243, 13, 13, 0.897);
            color:rgba(255, 255, 255, 0.904) ;
            text-align: center;
        }
        .card{
            background-color: #121118e4;
            box-shadow: 0px 3px 30px;
        }
        input{
            position: relative;
            border-radius: 15px ;
            border: 1px solid  rgba(243, 13, 13, 0.897);
            margin-top: 3%;
            width: 100%;
            padding-bottom: 9px ;
            display:block;
            padding:3% ;
            background-color: #121118e4;
    
        }
        .btn{
          
            background-color: rgba(243, 13, 13, 0.897);
            color: rgb(249, 249, 249);
            
        }
        label{
            color:white;
        }      
        .link-style{
            color:red;
        }
    </style>
</head>
<body class="custom-background">
    
    
    <div class="m-5"></div>
    <div class="container ">
        <div class="row justify-content-center">
            <div class="col-md-4">
                <div class="card">
                    <div class="card-body text-center">
                        <h2 class="card-title-light pb-1">LOGIN</h2> 
                    </div>
                    <form class='form-group m-3 ' method="post">
                        {% csrf_token %}
    
                        <div class="mb-3">
                            <label for="id_name" class="form-label">USERNAME</label>
                            {{ form.username }}
                        </div>
                        
                        <div class="mb-3">
                            <label for="password" class="form-label">PASSWORD</label>
                            {{ form.password}}
                        </div>
                        
                        <div class="card-body text-center ">
                            <button class="btn btn-block rounded w-100" type="submit">LOGIN</button>
                        </div>
                    </form>
                    <div class="card-body text-center">
                        <p style="color: white;">don't have an account? <a class="link-style" href="{% url 'register' %}">register here</a>.</p>
                    </div>
                    {% if error_message %}
                        <p>{{ error_message }}</p>
                    {% endif %}
                </div>
            </div>  
        </div>
    </div>
    

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js" integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy" crossorigin="anonymous"></script>

</body>
</html>
