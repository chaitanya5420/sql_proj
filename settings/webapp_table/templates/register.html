<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Registration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        .link-style {
            color: #007bff; /* Change color as needed */
            text-decoration: none;
        }
        .link-style:hover {
            text-decoration: underline;
        }
        .card-body.text-center {
            padding: 10px; /* Adjust the value as needed */
        }
        .form-froup{
            margin-bottom:10px;
        }
        .btn{
          
            background-color: rgba(243, 13, 13, 0.897);
            color: rgb(249, 249, 249); 
        }
        .card{
            background-color: #121118e4;
            box-shadow: 0px 3px 30px;
        }
        h2{
            border-bottom: 1px solid  rgba(243, 13, 13, 0.897);
            color:white ;
            text-align: center;
        }
        label{
            color:white;
        }       
        .link-style{
            color:red;
        } 

    </style>
    
</head>
<body>
    <div class="m-5"></div>
        <div class="container ">
            <div class="row justify-content-center">
                <div class="col-md-4">
                    <div class="card ">
                        <div class="card-body text-center">
                            <h2  class="card-title-light mb-1 p-2">REGISTER</h2> 
                        </div>
                        <form class="form-group m-3" method="post">
                            {% csrf_token %}
                            <div >
                                <label class="mb-3" for="id_name" class="form-label">USERNAME</label>
                                {{ form.username }}
                            </div>
                           
                            <div class="mb-4 mt-2">
                                <label for="id_name" class="form-label">EMAIL</label>
                                {{ form.email}}
                            </div>
                            <div class="mb-4 mt-2">
                                <label for="id_name" class="form-label">PASSWORD</label>
                                {{ form.password }}
                            </div>
                           
                            <div cclass="mb-4 mt-2 ">
                                <label for="id_name" class="form-label">CONFIRM_PASSWORD</label>
                                {{ form.confirm_password}}
                            </div>
                            <div class="card-body text-center mt-3">
                                <button class="btn btn-block rounded w-100 " type="submit">REGISTER</button>
                            </div>
                        </form>
                        <div class="card-body text-center">
                            <p  style="color: white;">Already have an account? <a class="link-style" href="{% url 'login' %}">login</a> here.</p>
                            
                        </div>
                    </div>
                </div>  
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js" integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy" crossorigin="anonymous"></script>

</body>
</html>
