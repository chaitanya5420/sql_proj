{% comment %} <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload File</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        .link-style {
            color: #007bff; /* Change color as needed */
            text-decoration: none;
        }
        .link-style:hover {
            text-decoration: underline;
        }
        .card-body.text-center {
            padding: 10px; /* Adjust the value as needed */
        }
        .form-froup{
            margin-bottom:10px;
        }
        .btn{
          
            background-color: rgba(243, 13, 13, 0.897);
            color: rgb(249, 249, 249); 
        }
        .card{
            background-color: #121118e4;
            box-shadow: 0px 3px 30px;
        }
        h2{
            border-bottom: 1px solid  rgba(243, 13, 13, 0.897);
            color:white ;
            text-align: center;
        }
        label{
            color:white;
        }       
        .link-style{
            color:red;
        } 

    </style>
   
</head>
<body>
    <div class="m-5"></div>
        <div class="container ">
            <div class="row justify-content-center">
                <div class="col-md-4">
                    <div class="card ">
                        <div class="card-body text-center">
                            <h2  class="card-title-light mb-1 p-2">REGISTER</h2> 
                        </div>
                        <form class='form-group m-3 'method="post" enctype="multipart/form-data">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="id_name" class="form-label">File Name</label>
                            {{ form.name }}
                        </div>
                        <div class="mb-3">
                            <label for="id_file" class="form-label">Select File</label>
                            {{ form.file }}
                        </div>
                        <div class="card-body text-center mt-3">
                            <button class="btn btn-block rounded w-100 " type="submit">upload</button>
                        </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html> {% endcomment %}
